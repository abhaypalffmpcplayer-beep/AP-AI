<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AP-AI</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#212121;
    color:#fff;
    height:100vh;
    overflow:hidden;
}

.app{
    display:flex;
    height:100vh;
}

/* SIDEBAR */
.sidebar{
    width:260px;
    background:#171717;
    border-right:1px solid #303030;
    display:flex;
    flex-direction:column;
    padding:12px;
}

.new-chat{
    width:100%;
    padding:13px;
    border:1px solid #444;
    border-radius:10px;
    background:#212121;
    color:#fff;
    cursor:pointer;
    font-size:15px;
    text-align:left;
}

.new-chat:hover{
    background:#2b2b2b;
}

.logo{
    padding:22px 10px;
    font-size:24px;
    font-weight:bold;
}

.logo span{
    color:#10a37f;
}

.history{
    flex:1;
    overflow-y:auto;
}

.history-title{
    color:#888;
    font-size:12px;
    padding:10px;
}

.history-item{
    padding:10px;
    border-radius:8px;
    color:#ddd;
    cursor:pointer;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.history-item:hover{
    background:#2a2a2a;
}

.bottom{
    border-top:1px solid #333;
    padding-top:10px;
}

.bottom button{
    width:100%;
    border:0;
    background:transparent;
    color:#ddd;
    padding:11px;
    text-align:left;
    cursor:pointer;
    border-radius:8px;
}

.bottom button:hover{
    background:#292929;
}

/* MAIN */
.main{
    flex:1;
    display:flex;
    flex-direction:column;
    min-width:0;
}

.topbar{
    height:60px;
    border-bottom:1px solid #303030;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 20px;
}

.title{
    font-size:18px;
    font-weight:bold;
}

.status{
    font-size:12px;
    color:#10a37f;
}

/* CHAT */
.chat{
    flex:1;
    overflow-y:auto;
    padding-bottom:140px;
}

.welcome{
    min-height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    text-align:center;
    padding:30px;
}

.ai-logo{
    width:65px;
    height:65px;
    border-radius:20px;
    background:#10a37f;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:30px;
    font-weight:bold;
    margin-bottom:20px;
}

.welcome h1{
    font-size:34px;
    margin-bottom:10px;
}

.welcome p{
    color:#aaa;
    max-width:500px;
    line-height:1.6;
}

.message{
    width:100%;
    padding:25px max(20px,calc((100% - 900px)/2));
    display:flex;
    gap:15px;
}

.message.user{
    background:#2f2f2f;
}

.avatar{
    min-width:35px;
    height:35px;
    border-radius:8px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
    font-size:14px;
}

.user .avatar{
    background:#555;
}

.assistant .avatar{
    background:#10a37f;
}

.message-content{
    line-height:1.65;
    white-space:pre-wrap;
    overflow-wrap:anywhere;
    max-width:800px;
}

.copy-btn{
    margin-top:12px;
    padding:6px 10px;
    border:1px solid #444;
    border-radius:7px;
    background:#212121;
    color:#aaa;
    cursor:pointer;
    font-size:12px;
}

.copy-btn:hover{
    color:#fff;
}

/* INPUT */
.input-area{
    position:fixed;
    bottom:0;
    left:260px;
    right:0;
    background:linear-gradient(transparent,#212121 25%);
    padding:25px 20px 20px;
}

.input-box{
    max-width:900px;
    margin:auto;
    background:#2f2f2f;
    border:1px solid #555;
    border-radius:16px;
    display:flex;
    align-items:flex-end;
    padding:8px;
    box-shadow:0 5px 30px rgba(0,0,0,.25);
}

textarea{
    flex:1;
    resize:none;
    min-height:44px;
    max-height:160px;
    background:transparent;
    border:0;
    outline:0;
    color:#fff;
    font-size:15px;
    padding:12px;
    font-family:inherit;
}

textarea::placeholder{
    color:#999;
}

.send{
    width:44px;
    height:44px;
    border:0;
    border-radius:10px;
    background:#10a37f;
    color:white;
    font-size:20px;
    cursor:pointer;
}

.send:hover{
    background:#0d8f70;
}

.send:disabled{
    opacity:.4;
    cursor:not-allowed;
}

.hint{
    max-width:900px;
    margin:8px auto 0;
    text-align:center;
    color:#777;
    font-size:11px;
}

/* TYPING */
.typing{
    display:flex;
    gap:5px;
    align-items:center;
    height:25px;
}

.dot{
    width:7px;
    height:7px;
    background:#aaa;
    border-radius:50%;
    animation:bounce 1.2s infinite;
}

.dot:nth-child(2){
    animation-delay:.15s;
}

.dot:nth-child(3){
    animation-delay:.3s;
}

@keyframes bounce{
    0%,60%,100%{
        transform:translateY(0);
    }
    30%{
        transform:translateY(-6px);
    }
}

/* MOBILE */
.mobile-menu{
    display:none;
    border:0;
    background:transparent;
    color:#fff;
    font-size:24px;
    cursor:pointer;
}

@media(max-width:700px){

    .sidebar{
        position:fixed;
        z-index:20;
        left:-270px;
        top:0;
        bottom:0;
        transition:.25s;
    }

    .sidebar.open{
        left:0;
    }

    .mobile-menu{
        display:block;
    }

    .input-area{
        left:0;
    }

    .message{
        padding:20px 14px;
    }

    .welcome h1{
        font-size:28px;
    }

    .topbar{
        padding:0 12px;
    }
}
</style>
</head>

<body>

<div class="app">

    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">

        <button class="new-chat" onclick="newChat()">
            ＋ New chat
        </button>

        <div class="logo">
            AP-<span>AI</span>
        </div>

        <div class="history">
            <div class="history-title">CHAT HISTORY</div>
            <div id="historyList"></div>
        </div>

        <div class="bottom">
            <button onclick="clearHistory()">🗑 Clear conversations</button>
            <button onclick="toggleTheme()">🌙 Toggle theme</button>
        </div>

    </aside>

    <!-- MAIN -->
    <main class="main">

        <header class="topbar">

            <button class="mobile-menu" onclick="toggleSidebar()">
                ☰
            </button>

            <div class="title">
                AP-AI
            </div>

            <div class="status">
                ● Online
            </div>

        </header>

        <section class="chat" id="chat">

            <div class="welcome" id="welcome">

                <div class="ai-logo">
                    AI
                </div>

                <h1>How can I help you?</h1>

                <p>
                    Welcome to AP-AI. Ask me anything and I will try to help you.
                </p>

            </div>

        </section>

    </main>

</div>


<!-- INPUT -->
<div class="input-area">

    <div class="input-box">

        <textarea
            id="messageInput"
            placeholder="Message AP-AI..."
            rows="1"
            onkeydown="handleKey(event)"
        ></textarea>

        <button
            class="send"
            id="sendButton"
            onclick="sendMessage()"
        >
            ↑
        </button>

    </div>

    <div class="hint">
        AP-AI can make mistakes. Check important information.
    </div>

</div>


<script>

const input = document.getElementById("messageInput");
const chat = document.getElementById("chat");
const sendButton = document.getElementById("sendButton");
const historyList = document.getElementById("historyList");

let conversations =
    JSON.parse(localStorage.getItem("ap_ai_history") || "[]");


/* ENTER KEY */
function handleKey(event){

    if(event.key === "Enter" && !event.shiftKey){

        event.preventDefault();
        sendMessage();

    }

}


/* NEW CHAT */
function newChat(){

    chat.innerHTML = `
        <div class="welcome" id="welcome">

            <div class="ai-logo">
                AI
            </div>

            <h1>How can I help you?</h1>

            <p>
                Welcome to AP-AI. Ask me anything and I will try to help you.
            </p>

        </div>
    `;

    input.focus();

}


/* ADD MESSAGE */
function addMessage(type,text){

    const welcome = document.getElementById("welcome");

    if(welcome){
        welcome.remove();
    }

    const message = document.createElement("div");

    message.className = "message " + type;

    const avatar =
        type === "user" ? "YOU" : "AI";

    message.innerHTML = `
        <div class="avatar">${avatar}</div>

        <div>

            <div class="message-content"></div>

            ${
                type === "assistant"
                ?
                `<button class="copy-btn" onclick="copyText(this)">
                    Copy
                </button>`
                :
                ""
            }

        </div>
    `;

    message.querySelector(".message-content").textContent = text;

    chat.appendChild(message);

    chat.scrollTop = chat.scrollHeight;

    return message;

}


/* TYPING */
function showTyping(){

    const welcome = document.getElementById("welcome");

    if(welcome){
        welcome.remove();
    }

    const message = document.createElement("div");

    message.className = "message assistant";
    message.id = "typingMessage";

    message.innerHTML = `
        <div class="avatar">AI</div>

        <div class="typing">

            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>

        </div>
    `;

    chat.appendChild(message);

    chat.scrollTop = chat.scrollHeight;

}


/* SEND MESSAGE */
async function sendMessage(){

    const text = input.value.trim();

    if(!text || sendButton.disabled){
        return;
    }

    addMessage("user",text);

    input.value = "";

    sendButton.disabled = true;

    showTyping();

    try{

        const response = await fetch("/api/chat",{

            method:"POST",

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify({
                message:text
            })

        });


        const data = await response.json();

        const typing =
            document.getElementById("typingMessage");

        if(typing){
            typing.remove();
        }


        if(!response.ok){

            throw new Error(
                data.error || "Server error"
            );

        }


        addMessage(
            "assistant",
            data.reply || "No response received."
        );


        saveHistory(text,data.reply);


    }catch(error){

        const typing =
            document.getElementById("typingMessage");

        if(typing){
            typing.remove();
        }

        addMessage(
            "assistant",
            "⚠️ AI se response nahi aa paaya.\n\n" +
            "Server aur OpenAI API key check karo.\n\n" +
            "Error: " + error.message
        );

    }


    sendButton.disabled = false;

    input.focus();

}


/* COPY */
function copyText(button){

    const content =
        button.parentElement.querySelector(".message-content");

    navigator.clipboard.writeText(content.innerText);

    button.innerText = "Copied!";

    setTimeout(()=>{

        button.innerText = "Copy";

    },1500);

}


/* HISTORY */
function saveHistory(question,answer){

    conversations.unshift({

        question:question,
        answer:answer,
        time:Date.now()

    });

    conversations =
        conversations.slice(0,20);

    localStorage.setItem(
        "ap_ai_history",
        JSON.stringify(conversations)
    );

    renderHistory();

}


function renderHistory(){

    historyList.innerHTML = "";

    conversations.forEach(item=>{

        const div =
            document.createElement("div");

        div.className = "history-item";

        div.textContent = item.question;

        div.onclick = ()=>{

            newChat();

            addMessage(
                "user",
                item.question
            );

            addMessage(
                "assistant",
                item.answer
            );

        };

        historyList.appendChild(div);

    });

}


function clearHistory(){

    if(confirm("Clear all chat history?")){

        conversations = [];

        localStorage.removeItem(
            "ap_ai_history"
        );

        renderHistory();

        newChat();

    }

}


/* MOBILE SIDEBAR */
function toggleSidebar(){

    document
        .getElementById("sidebar")
        .classList.toggle("open");

}


/* THEME */
function toggleTheme(){

    document.body.classList.toggle("light");

    if(document.body.classList.contains("light")){

        document.body.style.background = "#fff";
        document.body.style.color = "#111";

    }else{

        document.body.style.background = "#212121";
        document.body.style.color = "#fff";

    }

}


/* AUTO RESIZE */
input.addEventListener("input",()=>{

    input.style.height = "auto";

    input.style.height =
        Math.min(input.scrollHeight,160) + "px";

});


renderHistory();

input.focus();

</script>

</body>
</html>
